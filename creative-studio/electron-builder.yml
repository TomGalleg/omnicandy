# Installer for CreateCraft (Windows). Build:  npm run dist   (unpacked app for testing:  npm run dist:dir)
#
# Connectors that ship with CreateCraft are plain .ccadapter files in <install>/resources/adapters, outside app.asar, so they
# stay independently updateable (a newer package in the inbox or a later installer replaces them) and verifiable by hash and
# signature. Release builds are signed with the OFFICIAL release key only: see docs/release-signing.md and
# scripts/release-check.mjs. Nothing from Autodesk, Adobe or any other vendor is bundled.
appId: com.createcraft.app
productName: CreateCraft
artifactName: CreateCraft-Setup-${version}.${ext}
directories:
  output: release
  buildResources: resources
files:
  - out/**
  - package.json
  - '!**/*.map'
asar: true
asarUnpack:
  # The Claude Agent SDK starts its own native binary; it cannot run from inside the archive.
  - node_modules/@anthropic-ai/**
extraResources:
  - from: resources/adapters
    to: adapters
    filter: ['*.ccadapter', 'catalog.json']
  - from: resources/trust
    to: trust
  - from: resources/window-tracker.ps1
    to: window-tracker.ps1
  - from: resources/icon.ico
    to: icon.ico
  - from: fixtures/sample-project
    to: sample-project
win:
  target:
    - target: nsis
      arch: [x64]
  icon: resources/icon.ico
  # Code signing of the executable and installer is a release step with the organisation's certificate (docs/release-signing.md).
  signAndEditExecutable: false
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
