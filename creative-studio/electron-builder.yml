# Installer for OmniCandy (Windows). Build:  npm run dist   (unpacked app for testing:  npm run dist:dir)
#
# Connectors that ship with OmniCandy are plain .ccadapter files in <install>/resources/adapters, outside app.asar, so they
# stay independently updateable (a newer package in the inbox or a later installer replaces them) and verifiable by hash and
# signature. Release builds are signed with the OFFICIAL release key only: see docs/release-signing.md and
# scripts/release-check.mjs. Nothing from Autodesk, Adobe or any other vendor is bundled.
appId: com.createcraft.app
productName: OmniCandy
artifactName: OmniCandy-Setup-${version}.${ext}
directories:
  output: release
  buildResources: resources
files:
  - out/**
  - package.json
  - '!**/*.map'
asar: true
asarUnpack:
  # The Claude Agent SDK starts its own native binary; it cannot run from inside the archive.
  - node_modules/@anthropic-ai/**
extraResources:
  - from: resources/adapters
    to: adapters
    filter: ['*.ccadapter', 'catalog.json']
  - from: resources/trust
    to: trust
  # The planner's MCP server: one file that runs with OmniCandy's own runtime (ELECTRON_RUN_AS_NODE=1), so AI clients can launch it.
  - from: out/planner-mcp.cjs
    to: planner-mcp.cjs
  - from: resources/icon.png
    to: icon.png
  - from: fixtures/sample-project
    to: sample-project
win:
  # Windows only: the PowerShell window tracker that embeds a Craft app's window, and the .ico.
  extraResources:
    - from: resources/window-tracker.ps1
      to: window-tracker.ps1
    - from: resources/icon.ico
      to: icon.ico
  target:
    - target: nsis
      arch: [x64]
  icon: resources/icon.ico
# Linux (Ubuntu x86-64 first). UNTESTED: nothing here has been built or installed on Linux yet (docs/linux-compatibility.md).
# No window tracker: Craft apps open in their own windows. Keys need a keyring, so the deb recommends one.
linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  icon: resources/icon.png
  category: Graphics
  artifactName: OmniCandy-${version}-linux-${arch}.${ext}
  maintainer: OmniCandy
  synopsis: AI-assisted creative production
  executableName: createcraft
deb:
  depends: [libgtk-3-0, libnotify4, libnss3, libxss1, libxtst6, xdg-utils, libatspi2.0-0, libuuid1, libsecret-1-0]
  recommends: [gnome-keyring, libvulkan1, mesa-vulkan-drivers]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
